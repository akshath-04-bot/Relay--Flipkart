<title>Relay guided demo</title>
<script>
/* The tour keeps its own saved state, so it never touches what a reviewer did in index.html.
   Every storage key on this page gets a "relay-tour:" prefix before the app scripts load. */
(function () {
  var P = 'relay-tour:';
  try {
    var proto = Storage.prototype, g = proto.getItem, s = proto.setItem, r = proto.removeItem;
    proto.getItem = function (k) { return g.call(this, P + k); };
    proto.setItem = function (k, v) { return s.call(this, P + k, v); };
    proto.removeItem = function (k) { return r.call(this, P + k); };
    window.__tourStore = { clearApp: function () { ['relay-kinetic-state-v1', 'relay-kinetic-view-v1'].forEach(function (k) { r.call(localStorage, P + k); }); } };
  } catch (e) { window.__tourStore = { clearApp: function () {} }; }
})();
</script>
